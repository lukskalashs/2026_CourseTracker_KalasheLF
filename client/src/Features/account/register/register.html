<div class="container mx-auto mt-10 p-5 flex justify-center">
  <div class="card w-full max-w-md bg-base-200 shadow-xl">
    <div class="card-body">
      <h2 class="card-title justify-center text-2xl mb-4">Register</h2>
      
      <form #registerForm="ngForm" (ngSubmit)="Register()" autocomplete="off">
        <div class="form-control w-full mb-2">
          <label class="label"><span class="label-text">Display Name</span></label>
          <input type="text" name="displayName" [(ngModel)]="Regmodel.displayName" class="input input-bordered w-full" required />
        </div>

        <div class="form-control w-full mb-2">
          <label class="label"><span class="label-text">Username</span></label>
          <input type="text" name="username" [(ngModel)]="Regmodel.username" class="input input-bordered w-full" required />
        </div>

        <div class="form-control w-full mb-2">
          <label class="label"><span class="label-text">Email Address</span></label>
          <input type="email" name="email" [(ngModel)]="Regmodel.email" class="input input-bordered w-full" required />
        </div>

        <div class="form-control w-full mb-4">
          <label class="label"><span class="label-text">Password</span></label>
          <input type="password" name="password" [(ngModel)]="Regmodel.password" class="input input-bordered w-full" required minlength="6" />
        </div>

        <div class="card-actions justify-end mt-4">
          <button type="button" class="btn btn-ghost" (click)="cancelReg()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="!registerForm.valid">Register</button>
        </div>
      </form>
    </div>
  </div>
</div>
