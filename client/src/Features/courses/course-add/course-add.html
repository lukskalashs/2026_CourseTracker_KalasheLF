<div class="container mx-auto p-4">
  <div class="max-w-2xl mx-auto border border-gray-300 p-4 bg-gray-50 text-gray-900">
    <h2 class="text-2xl font-bold mb-4 border-b border-gray-300 pb-2">Add New Course</h2>
    
    <form #courseForm="ngForm" (ngSubmit)="addCourse()" autocomplete="off">
      
      <div class="mb-4">
        <label class="block font-bold mb-1">Course Title *</label>
        <input type="text" name="title" [(ngModel)]="AddCourseModel.title" class="input input-sm input-bordered w-full rounded-none" required />
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block font-bold mb-1">Platform *</label>
          <select name="platformId" [(ngModel)]="AddCourseModel.platformId" class="select select-sm select-bordered w-full rounded-none" required>
            <option disabled value="">Select a platform</option>
            @for (platform of Platforms; track platform.id) {
              <option [ngValue]="platform.id">{{ platform.name }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block font-bold mb-1">Topic *</label>
          <select name="topicId" [(ngModel)]="AddCourseModel.topicId" class="select select-sm select-bordered w-full rounded-none" required>
            <option disabled value="">Select a topic</option>
            @for (topic of Topis; track topic.id) {
              <option [ngValue]="topic.id">{{ topic.name }}</option>
            }
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4 items-center">
        <div>
          <label class="block font-bold mb-1">Rating (1-5)</label>
          <input type="number" name="rating" [(ngModel)]="AddCourseModel.rating" min="1" max="5" class="input input-sm input-bordered w-full rounded-none" />
        </div>

        <div class="flex items-center mt-6">
          <input type="checkbox" name="isCompleted" [(ngModel)]="AddCourseModel.isCompleted" class="checkbox checkbox-sm rounded-none mr-2 border-gray-400" />
          <label class="font-bold cursor-pointer">Mark as Completed?</label>
        </div>
      </div>

      <div class="mb-4">
        <label class="block font-bold mb-1">Personal Notes</label>
        <textarea name="notes" [(ngModel)]="AddCourseModel.notes" class="textarea textarea-bordered w-full rounded-none" rows="3" placeholder="Add your notes here..."></textarea>
      </div>

      <div class="flex justify-end gap-2 mt-4 pt-4 border-t border-gray-300">
        <button type="button" class="btn btn-sm rounded-none btn-outline" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn btn-sm rounded-none btn-primary" [disabled]="!courseForm.valid">Save Course</button>
      </div>
    </form>
  </div>
</div>
